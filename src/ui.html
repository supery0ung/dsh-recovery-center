<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH Recovery Center</title><style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fc;color:#17243b}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1040px;margin-inline:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px;letter-spacing:-.6px;margin:0 0 8px}p{line-height:1.65;color:#607087;margin:8px 0}button,input{font:inherit}button{cursor:pointer;border:1px solid #d6dfeb;border-radius:10px;padding:10px 16px;background:white;color:#23324c}button:disabled{opacity:.5;cursor:wait}.primary{background:#2563eb;color:white;border-color:#2563eb}.tag{font-size:12px;background:#e6edfb;color:#385c9b;border-radius:20px;padding:6px 12px;white-space:nowrap}.card{padding:22px;border:1px solid #e0e6ef;background:white;border-radius:16px;margin-top:20px}.create{display:flex;gap:10px;margin-top:16px}input{width:100%;min-width:0;border:1px solid #d4ddea;border-radius:10px;padding:11px;background:transparent;color:inherit}.point{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px solid #e8edf4}.point:last-child{border:0}.point strong{display:block;font-size:16px}.meta{font-size:13px;color:#6f7e94;margin-top:7px}.empty{text-align:center;padding:34px;color:#6f7e94}.notice{font-size:14px;padding:14px 16px;border-radius:10px;background:#eaf1ff;color:#305491;white-space:pre-wrap;margin-top:18px}.error{background:#fff0ef;color:#a1322c}h2{font-size:16px;margin:0}footer{font-size:12px;color:#77849a;margin-top:20px;line-height:1.7}dialog{max-width:480px;width:calc(100% - 36px);border:1px solid #dbe3ee;border-radius:18px;padding:24px;background:white;color:#17243b}dialog::backdrop{background:#11213b77}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}@media(prefers-color-scheme:dark){:root{background:#171b23;color:#e4eaf3}.card,button,dialog{background:#202630;color:#e4eaf3;border-color:#364152}p,.meta,footer{color:#a5b3c8}.point{border-color:#364152}.primary{background:#326cf0}.notice{background:#243650;color:#b8d0ff}.error{background:#462b30;color:#ffb6b0}}@media(max-width:550px){body{padding:18px}.create{flex-direction:column}header{align-items:flex-start}.point{align-items:flex-start}}
select{font:inherit;background:transparent;color:inherit;border:1px solid #d4ddea;border-radius:8px;padding:7px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.create button{flex-shrink:0}@media(max-width:700px){.create{flex-direction:column}}</style></head>
<body>
<header><div><h1 data-key="title"></h1><p data-key="subtitle"></p></div><div class="tools"><span class="tag"><span data-key="badge"></span> · 0.1.2</span><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select></div></header>
<div class="card"><h2 data-key="saveTitle"></h2><p data-key="saveHelp"></p><div class="create"><input id="label" maxlength="100"><button id="capture" class="primary" data-key="capture"></button></div></div>
<div id="notice" class="notice" role="status"></div>
<section class="card"><div class="row"><h2 data-key="savedTitle"></h2><button id="refresh" data-key="refresh"></button></div><div id="points"></div></section>
<section class="card"><h2 data-key="rescueTitle"></h2><p data-key="rescueLocation"></p><p id="shortcutStatus"></p><p id="shortcutPath" style="font-size:12px;overflow-wrap:anywhere;user-select:all"></p><button id="shortcut" data-key="createShortcut"></button></section>
<footer><span data-key="footer"></span><br><span data-key="rescueHelp"></span></footer>
<dialog id="confirm"><h2 data-key="confirmTitle"></h2><p id="selected"></p><p data-key="confirmBody"></p><div class="actions"><button id="cancel" data-key="cancel"></button><button id="restore" class="primary" data-key="restore"></button></div></dialog>
<script>
/*I18N_DATA*/
const $=id=>document.getElementById(id), embedded=window.parent!==window;
const normalize=value=>/^zh(?:[-_]|$)/i.test(value||'')?'zh':'en';
let stored;try{stored=localStorage.getItem('recovery-language')}catch{}
let lang=normalize(new URLSearchParams(location.search).get('lang')||(!embedded&&stored)||navigator.language);
let busy=false,selected=null,waiting=false,lastData=null,timer=null,noticeState={key:'reading'};
let rescueToken=location.hash.slice(1);
if(rescueToken){sessionStorage.setItem('recovery-token',rescueToken);history.replaceState(null,'',location.pathname+location.search)}else rescueToken=sessionStorage.getItem('recovery-token')||'';
const t=key=>I18N.dictionaries[lang][key];
function diagnostic(text){if(lang==='zh')return text;let output=String(text).replace(/DSH 版本不同（恢复点 (.*?)，当前 (.*?)），不能直接恢复插件。/g,'DSH version mismatch (saved: $1, current: $2). Plugin restore is blocked.');for(const [zh,en] of Object.entries(I18N.diagnostics))output=output.split(zh).join(en);return output}
function date(point){return new Date(point.created).toLocaleString(lang==='zh'?'zh-CN':'en-US')}
function pointName(p){return p.kind==='before-restore'?t('beforeRestore'):p.label}
function renderNotice(){const n=noticeState;$('notice').textContent=n.key==='summary'?'DSH '+lastData.dshVersion+' · '+lastData.points.length+' '+t('points'):n.key?t(n.key):diagnostic(n.raw);$('notice').className='notice'+(n.error?' error':'')}
function notice(key,error=false,raw=''){noticeState={key,error,raw};renderNotice()}
function disable(value){busy=value;$('capture').disabled=value;document.querySelectorAll('[data-restore]').forEach(b=>b.disabled=value||!lastData?.allowRestart)}
function renderShortcut(){if(!lastData)return;const s=lastData.shortcut||{state:'missing'};const key={desktop:'shortcutDesktop',saved:'shortcutSaved',missing:'shortcutMissing',conflict:'shortcutConflict',unsupported:'shortcutUnsupported'}[s.state]||'shortcutMissing';$('shortcutStatus').textContent=t(key);$('shortcutPath').textContent=s.desktop||s.path||''}
function renderPoints(){if(!lastData)return;renderShortcut();$('points').replaceChildren();for(const p of lastData.points){const row=document.createElement('div');row.className='point';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=pointName(p);const meta=document.createElement('div');meta.className='meta';meta.textContent=date(p)+' · '+Object.keys(p.plugins).length+' '+t('plugins')+' · '+(p.bytes/1048576).toFixed(1)+' MB';info.append(name,meta);const button=document.createElement('button');button.textContent=t('rollback');button.dataset.restore=p.id;button.onclick=()=>{selected=p;$('selected').textContent=pointName(p)+' · '+date(p);$('confirm').showModal()};row.append(info,button);$('points').append(row)}if(!lastData.points.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('empty');$('points').append(empty)}disable(busy)}
function setLanguage(value){lang=normalize(value);document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title='DSH '+t('title');document.querySelectorAll('[data-key]').forEach(el=>el.textContent=t(el.dataset.key));$('label').placeholder=t('placeholder');$('label').setAttribute('aria-label',t('label'));$('language').value=lang;$('language').setAttribute('aria-label',t('language'));$('language').hidden=embedded;renderPoints();renderNotice();if(selected)$('selected').textContent=pointName(selected)+' · '+date(selected)}
$('language').onchange=()=>{setLanguage($('language').value);try{localStorage.setItem('recovery-language',lang)}catch{}};
window.addEventListener('message',e=>{if(embedded&&e.source===window.parent&&e.origin===location.origin&&e.data?.type==='dsh-recovery-locale'&&['en','zh'].includes(e.data.lang))setLanguage(e.data.lang)});
async function api(action,data){const response=await fetch('./'+action,{method:data?'POST':'GET',credentials:'same-origin',headers:{...(data?{'Content-Type':'application/json'}:{}),...(rescueToken?{'X-Recovery-Token':rescueToken}:{})},...(data?{body:JSON.stringify(data)}:{})});const result=await response.json();if(!response.ok)throw Error(result.error||t('failed'));return result}
function poll(ms){clearTimeout(timer);timer=setTimeout(refresh,ms)}
async function refresh(){try{const data=await api('status');lastData=data;disable(data.busy);renderPoints();if(!data.allowRestart)notice('managed');else if(data.result&&(waiting||data.busy)){const result=data.result;notice(result.state==='error'?null:result.state,result.state==='error',result.message);if(['done','error'].includes(result.state))waiting=false}else notice('summary');if(waiting||data.busy)poll(2000)}catch(e){notice(waiting?'reconnect':null,!waiting,e.message);if(waiting)poll(2500)}}
$('capture').onclick=async()=>{disable(true);notice('copying');try{await api('capture',{label:$('label').value.trim()||t('manual')});$('label').value='';await refresh();notice('saved')}catch(e){notice(null,true,e.message)}finally{disable(false)}};
$('shortcut').onclick=async()=>{$('shortcut').disabled=true;try{await api('shortcut',{});await refresh()}catch(e){notice(null,true,e.message)}finally{$('shortcut').disabled=false}};
$('refresh').onclick=refresh;$('cancel').onclick=()=>$('confirm').close();$('restore').onclick=async()=>{$('restore').disabled=true;try{await api('restore',{id:selected.id,confirm:'restore-and-restart'});$('confirm').close();waiting=true;disable(true);notice('accepted');poll(1500)}catch(e){notice(null,true,e.message);$('confirm').close()}finally{$('restore').disabled=false}};
setLanguage(lang);refresh();
</script></body></html>
